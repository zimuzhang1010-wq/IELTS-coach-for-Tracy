<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>IELTS Pit Wall · Tracy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   F1 PIT WALL — IELTS Speaking Coach for Tracy
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Background layers — deep midnight purple */
  --bg-deep:     #07051a;
  --bg-base:     #0d0820;
  --bg-elev:     #15102e;
  --bg-card:     #1d1640;
  --bg-card-hi:  #2a1f5a;
  --line:        #3a2d6e;
  --line-bright: #5a448c;

  /* Text */
  --txt:         #f0e9ff;
  --txt-dim:     #b0a5cc;
  --txt-mute:    #6e6294;

  /* Hero color: electric purple */
  --purple:      #a855f7;
  --purple-deep: #7c3aed;
  --purple-bright: #c084fc;
  --purple-glow: rgba(168, 85, 247, 0.45);
  --purple-glow-soft: rgba(168, 85, 247, 0.18);

  /* Accents */
  --magenta:     #ec4899;       /* sister to purple */
  --magenta-glow: rgba(236, 72, 153, 0.4);
  --neon-pink:   #ff2bd6;
  --red:         #f43f5e;       /* F1 racing red, but rose-tinted */
  --red-glow:    rgba(244, 63, 94, 0.35);
  --amber:       #fbbf24;       /* purple sector style */
  --green:       #4ade80;
  --cyan:        #22d3ee;

  /* Tire compound colors (kept for F1 vibes) */
  --tire-soft:   #ef4444;
  --tire-medium: #fbbf24;
  --tire-hard:   #ffffff;

  /* Typography */
  --display:     'Bebas Neue', 'Impact', sans-serif;
  --body:        'Rajdhani', system-ui, sans-serif;
  --mono:        'JetBrains Mono', 'SF Mono', monospace;
}

html, body {
  background: var(--bg-base);
  color: var(--txt);
  font-family: var(--body);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

body {
  min-height: 100vh;
  background: var(--bg-base);
  position: relative;
  overflow-x: hidden;
}

/* Aurora gradient mesh — animated purple/magenta glow */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(168, 85, 247, 0.35) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 30%, rgba(236, 72, 153, 0.25) 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 0% 60%, rgba(124, 58, 237, 0.3) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% 110%, rgba(192, 132, 252, 0.2) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
  animation: aurora 20s ease-in-out infinite alternate;
}

@keyframes aurora {
  0%   { transform: scale(1) rotate(0deg); opacity: 0.9; }
  50%  { transform: scale(1.1) rotate(2deg); opacity: 1; }
  100% { transform: scale(1.05) rotate(-2deg); opacity: 0.85; }
}

/* Carbon-fiber + grain texture */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.015) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.012) 0 1px, transparent 1px 4px);
  pointer-events: none;
  z-index: 1;
  mix-blend-mode: overlay;
}

/* Diagonal racing stripes accent — top right and bottom left */
.app::before {
  content: '';
  position: fixed;
  top: -100px;
  right: -100px;
  width: 300px;
  height: 300px;
  background: linear-gradient(135deg, transparent 40%, var(--magenta) 41%, var(--magenta) 42%, transparent 43%, transparent 47%, var(--purple) 48%, var(--purple) 49%, transparent 50%);
  opacity: 0.15;
  pointer-events: none;
  z-index: 1;
}

/* ===================== APP CHROME ===================== */

.app {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 0 0 80px;
  position: relative;
}

/* Top status bar — like an F1 broadcast HUD */
.hud {
  position: sticky;
  top: 0;
  z-index: 50;
  background: linear-gradient(180deg, rgba(7, 5, 26, 0.85) 0%, rgba(13, 8, 32, 0.7) 100%);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--line);
  padding: 14px 20px 12px;
  position: relative;
}

.hud::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, var(--purple) 30%, var(--magenta) 70%, transparent 100%);
  opacity: 0.7;
}

.hud-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.hud-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.hud-flag {
  width: 26px;
  height: 26px;
  background:
    linear-gradient(45deg, transparent 47%, var(--purple) 47% 53%, transparent 53%),
    repeating-conic-gradient(#fff 0% 25%, #1a0d2e 0% 50%);
  background-size: 100% 100%, 9px 9px;
  border-radius: 4px;
  box-shadow:
    0 0 0 1px var(--line-bright),
    0 0 14px var(--purple-glow);
  flex-shrink: 0;
}

.hud-title {
  font-family: var(--display);
  font-size: 24px;
  letter-spacing: 0.1em;
  color: var(--txt);
  line-height: 1;
  text-shadow: 0 0 20px var(--purple-glow-soft);
}

.hud-title .accent {
  background: linear-gradient(135deg, var(--purple) 0%, var(--magenta) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 10px var(--purple-glow));
}

.hud-meta {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--txt-mute);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-align: right;
  line-height: 1.3;
}

.hud-meta .live {
  color: var(--neon-pink);
  font-weight: 700;
  text-shadow: 0 0 8px var(--magenta-glow);
}

.hud-meta .live::before {
  content: '●';
  display: inline-block;
  margin-right: 4px;
  animation: blink 1.2s infinite;
}

@keyframes blink { 50% { opacity: 0.3; } }

/* ===================== LOGIN GATE ===================== */

.gate {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 32px 24px;
  text-align: center;
  position: relative;
}

/* Vegas-strip glow behind login */
.gate::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 50% 35%, var(--purple-glow) 0%, transparent 55%),
    radial-gradient(circle at 50% 65%, var(--magenta-glow) 0%, transparent 50%);
  pointer-events: none;
  animation: gatePulse 4s ease-in-out infinite alternate;
}

@keyframes gatePulse {
  0%   { opacity: 0.7; transform: scale(1); }
  100% { opacity: 1; transform: scale(1.05); }
}

/* Decorative racing chevrons floating in background */
.gate::after {
  content: '◢◤';
  position: absolute;
  font-size: 320px;
  color: var(--purple);
  opacity: 0.04;
  letter-spacing: -40px;
  pointer-events: none;
  font-family: var(--display);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.gate-content {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 360px;
  animation: gateIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
}

@keyframes gateIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.gate-tag {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--purple-bright);
  letter-spacing: 0.4em;
  text-transform: uppercase;
  margin-bottom: 18px;
  animation: gateIn 0.8s 0.1s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
}

.gate-flag {
  width: 64px;
  height: 64px;
  margin: 0 auto 22px;
  background: repeating-conic-gradient(#fff 0% 25%, #1a0d2e 0% 50%);
  background-size: 16px 16px;
  border-radius: 8px;
  box-shadow:
    0 0 0 2px var(--purple),
    0 0 0 4px var(--bg-base),
    0 0 0 5px var(--magenta),
    0 8px 40px var(--purple-glow),
    0 16px 60px var(--magenta-glow);
  animation: flagFloat 3s ease-in-out infinite alternate, gateIn 0.8s 0.2s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
}

@keyframes flagFloat {
  from { transform: translateY(0) rotate(-2deg); }
  to   { transform: translateY(-6px) rotate(2deg); }
}

.gate-title {
  font-family: var(--display);
  font-size: 68px;
  line-height: 0.85;
  letter-spacing: 0.02em;
  color: var(--txt);
  margin-bottom: 10px;
  text-shadow: 0 0 30px var(--purple-glow);
  animation: gateIn 0.8s 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
}

.gate-title .accent {
  background: linear-gradient(135deg, var(--purple) 0%, var(--magenta) 50%, var(--neon-pink) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 14px var(--purple-glow));
  display: block;
}

.gate-sub {
  font-size: 15px;
  color: var(--txt-dim);
  margin-bottom: 38px;
  letter-spacing: 0.04em;
  animation: gateIn 0.8s 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
}

.gate-form {
  display: flex;
  flex-direction: column;
  gap: 14px;
  animation: gateIn 0.8s 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
}

.field {
  position: relative;
}

.field-label {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--purple-bright);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  margin-bottom: 7px;
  text-align: left;
}

.field-input {
  width: 100%;
  background: rgba(29, 22, 64, 0.6);
  border: 1px solid var(--line);
  border-left: 3px solid var(--purple);
  color: var(--txt);
  font-family: var(--mono);
  font-size: 15px;
  padding: 15px 16px;
  border-radius: 8px;
  outline: none;
  transition: all 0.2s;
  backdrop-filter: blur(10px);
}

.field-input:focus {
  border-color: var(--purple-bright);
  background: var(--bg-card-hi);
  box-shadow: 0 0 0 3px var(--purple-glow-soft), 0 0 24px var(--purple-glow-soft);
}

.gate-error {
  color: var(--neon-pink);
  font-size: 13px;
  margin-top: 6px;
  min-height: 18px;
  font-family: var(--mono);
  letter-spacing: 0.04em;
}

.gate-remember {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  font-size: 13px;
  color: var(--txt-dim);
  cursor: pointer;
  user-select: none;
}

.gate-remember input { accent-color: var(--purple); }

/* ===================== BUTTONS ===================== */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 22px;
  background: linear-gradient(135deg, var(--purple) 0%, var(--magenta) 100%);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-family: var(--display);
  font-size: 16px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 20px var(--purple-glow-soft), inset 0 1px 0 rgba(255,255,255,0.2);
}

.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
  opacity: 0;
  transition: opacity 0.2s;
}

.btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 28px var(--purple-glow), inset 0 1px 0 rgba(255,255,255,0.3);
}

.btn:hover::before { opacity: 1; }
.btn:active { transform: translateY(0); }
.btn-block { width: 100%; }

.btn-ghost {
  background: rgba(29, 22, 64, 0.5);
  color: var(--txt-dim);
  border: 1px solid var(--line);
  box-shadow: none;
  backdrop-filter: blur(8px);
}
.btn-ghost:hover {
  background: var(--bg-card-hi);
  color: var(--txt);
  border-color: var(--purple);
  box-shadow: 0 0 14px var(--purple-glow-soft);
  transform: translateY(0);
}

.btn-amber {
  background: linear-gradient(135deg, var(--amber) 0%, #f59e0b 100%);
  color: #1a0d2e;
  box-shadow: 0 4px 20px rgba(251, 191, 36, 0.25);
}
.btn-amber:hover {
  box-shadow: 0 8px 28px rgba(251, 191, 36, 0.5);
}

.btn-green {
  background: linear-gradient(135deg, var(--green) 0%, #10b981 100%);
  color: #07051a;
  box-shadow: 0 4px 20px rgba(74, 222, 128, 0.25);
}
.btn-green:hover {
  box-shadow: 0 8px 28px rgba(74, 222, 128, 0.5);
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
  filter: grayscale(0.5);
}

.btn-icon {
  padding: 10px 14px;
  font-size: 12px;
  letter-spacing: 0.12em;
}

/* ===================== TABS / SELECTOR ===================== */

.section {
  padding: 22px 20px 10px;
}

.section-eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--purple-bright);
  letter-spacing: 0.32em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.section-title {
  font-family: var(--display);
  font-size: 36px;
  line-height: 0.95;
  letter-spacing: 0.04em;
  color: var(--txt);
  margin-bottom: 10px;
  text-shadow: 0 0 30px var(--purple-glow-soft);
}

.section-sub {
  color: var(--txt-dim);
  font-size: 14px;
  margin-bottom: 18px;
}

/* Part selector — F1 timing tower style */
.parts {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 12px 20px 0;
  margin-bottom: 18px;
}

.part-card {
  background: rgba(29, 22, 64, 0.5);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 10px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  text-align: left;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(10px);
}

.part-card:hover {
  border-color: var(--line-bright);
  background: rgba(45, 31, 90, 0.6);
  transform: translateY(-2px);
}

.part-card.active {
  border-color: var(--purple);
  background: linear-gradient(180deg, rgba(168, 85, 247, 0.18) 0%, rgba(29, 22, 64, 0.7) 100%);
  box-shadow: 0 8px 28px var(--purple-glow-soft), inset 0 0 0 1px rgba(255,255,255,0.05);
}

.part-card.active::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 3px;
  background: linear-gradient(90deg, var(--purple) 0%, var(--magenta) 100%);
  box-shadow: 0 0 12px var(--purple-glow);
}

.part-num {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--txt-mute);
  letter-spacing: 0.18em;
}

.part-card.active .part-num { color: var(--purple-bright); }

.part-name {
  font-family: var(--display);
  font-size: 19px;
  letter-spacing: 0.06em;
  margin-top: 4px;
  color: var(--txt);
}

.part-card.active .part-name {
  background: linear-gradient(135deg, var(--purple-bright) 0%, var(--magenta) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.part-meta {
  font-size: 11px;
  color: var(--txt-mute);
  margin-top: 3px;
  font-family: var(--mono);
}

/* ===================== TOPIC LIST ===================== */

.topics {
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.topic-card {
  background: rgba(29, 22, 64, 0.55);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 15px 16px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  backdrop-filter: blur(10px);
  overflow: hidden;
}

.topic-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--purple) 0%, var(--magenta) 100%);
  transform: scaleY(0);
  transform-origin: top;
  transition: transform 0.25s ease;
}

.topic-card:hover {
  background: rgba(45, 31, 90, 0.75);
  border-color: var(--line-bright);
  transform: translateX(2px);
  box-shadow: 0 4px 20px var(--purple-glow-soft);
}

.topic-card:hover::before { transform: scaleY(1); }

.topic-card:active { transform: scale(0.99) translateX(2px); }

.topic-info {
  flex: 1;
  min-width: 0;
}

.topic-name {
  font-size: 16px;
  font-weight: 600;
  color: var(--txt);
  margin-bottom: 3px;
}

.topic-zh {
  font-size: 12px;
  color: var(--txt-mute);
}

.topic-stats {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.topic-stat {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--txt-mute);
}

.topic-stat .star { color: var(--amber); }
.topic-stat .check { color: var(--green); }

/* ===================== PRACTICE VIEW ===================== */

.practice {
  padding: 18px;
}

.practice-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--txt-dim);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  margin-bottom: 14px;
  background: none;
  border: none;
  padding: 0;
}

.practice-back:hover { color: var(--txt); }

.q-card {
  background: linear-gradient(180deg, rgba(45, 31, 90, 0.7) 0%, rgba(29, 22, 64, 0.75) 100%);
  border: 1px solid var(--line-bright);
  border-radius: 12px;
  padding: 22px 20px;
  position: relative;
  margin-bottom: 18px;
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(7, 5, 26, 0.4);
}

.q-card::before {
  content: '';
  position: absolute;
  top: 0; left: 20px; right: 20px;
  height: 2px;
  background: linear-gradient(90deg, var(--purple) 0%, var(--magenta) 50%, transparent 90%);
  box-shadow: 0 0 12px var(--purple-glow);
}

.q-eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--purple-bright);
  letter-spacing: 0.28em;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.q-text {
  font-size: 19px;
  line-height: 1.4;
  color: var(--txt);
  font-weight: 500;
}

/* Cue card for Part 2 */
.cue-bullets {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}

.cue-bullets-label {
  font-size: 12px;
  color: var(--txt-mute);
  margin-bottom: 8px;
  font-style: italic;
}

.cue-bullets ul {
  list-style: none;
  padding: 0;
}

.cue-bullets li {
  padding: 5px 0 5px 20px;
  font-size: 14px;
  color: var(--txt-dim);
  position: relative;
}

.cue-bullets li::before {
  content: '▸';
  position: absolute;
  left: 0;
  color: var(--purple);
  filter: drop-shadow(0 0 4px var(--purple-glow-soft));
}

/* ===================== TIMER ===================== */

.timer-block {
  background: linear-gradient(180deg, rgba(21, 16, 46, 0.8) 0%, rgba(13, 8, 32, 0.9) 100%);
  border: 1px solid var(--line-bright);
  border-radius: 12px;
  padding: 22px 18px;
  margin-bottom: 18px;
  text-align: center;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(10px);
}

.timer-block::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, var(--purple-glow-soft) 0%, transparent 60%);
  pointer-events: none;
}

.timer-stage {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--purple-bright);
  letter-spacing: 0.32em;
  text-transform: uppercase;
  margin-bottom: 10px;
  position: relative;
}

.timer-display {
  font-family: var(--display);
  font-size: 72px;

  auth: 'tracy_auth',

};

const progress = loadProgress();

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEYS.progress);
    return raw ? JSON.parse(raw) : { attempts: {}, mastered: {} };
  } catch { return { attempts: {}, mastered: {} }; }
}

function saveProgress() {
  localStorage.setItem(STORAGE_KEYS.progress, JSON.stringify(progress));
}

function markAttempt(qKey) {
  progress.attempts[qKey] = (progress.attempts[qKey] || 0) + 1;
  saveProgress();
}

function markMastered(qKey, band) {
  if (band >= 6) progress.mastered[qKey] = Math.max(progress.mastered[qKey] || 0, band);
  saveProgress();
}

function topicStats(topicId, isPart1) {
  // For part1, topicId is e.g. 'p1_art'
  // count attempts/mastered across its questions
  let attempts = 0, mastered = 0, total = 0;
  if (isPart1) {
    const topic = QUESTIONS.part1.find(t => t.id === topicId);
    if (!topic) return { attempts: 0, mastered: 0, total: 0 };
    total = topic.questions.length;
    topic.questions.forEach((_, i) => {
      const k = `${topicId}_q${i}`;
      if (progress.attempts[k]) attempts++;
      if (progress.mastered[k]) mastered++;
    });
  } else {
    // part2 topic: counts the cue card itself + its part3 questions
    const topic = QUESTIONS.part2.find(t => t.id === topicId);
    if (!topic) return { attempts: 0, mastered: 0, total: 0 };
    const p3 = QUESTIONS.part3[topic.part3id] || [];
    total = 1 + p3.length;
    if (progress.attempts[topicId]) attempts++;
    if (progress.mastered[topicId]) mastered++;
    p3.forEach((_, i) => {
      const k = `${topic.part3id}_q${i}`;
      if (progress.attempts[k]) attempts++;
      if (progress.mastered[k]) mastered++;
    });
  }
  return { attempts, mastered, total };
}

function overallStats() {
  let totalQ = 0, attempted = 0, mastered = 0;
  QUESTIONS.part1.forEach(t => {
    totalQ += t.questions.length;
    t.questions.forEach((_, i) => {
      const k = `${t.id}_q${i}`;
      if (progress.attempts[k]) attempted++;
      if (progress.mastered[k]) mastered++;
    });
  });
  QUESTIONS.part2.forEach(t => {
    totalQ += 1;
    if (progress.attempts[t.id]) attempted++;
    if (progress.mastered[t.id]) mastered++;
    const p3 = QUESTIONS.part3[t.part3id] || [];
    totalQ += p3.length;
    p3.forEach((_, i) => {
      const k = `${t.part3id}_q${i}`;
      if (progress.attempts[k]) attempted++;
      if (progress.mastered[k]) mastered++;
    });
  });
  return { totalQ, attempted, mastered };
}

function isAuthValid() {
  try {
    const raw = localStorage.getItem(STORAGE_KEYS.auth);
    if (!raw) return false;
    const { ts, expires } = JSON.parse(raw);
    if (!expires || Date.now() < expires) return true;
    return false;
  } catch { return false; }
}

function setAuth(remember) {
  const expires = Date.now() + (remember ? 30 : 1) * 24 * 60 * 60 * 1000;
  localStorage.setItem(STORAGE_KEYS.auth, JSON.stringify({ ts: Date.now(), expires }));
  state.authed = true;
}

/* ============================================================
   TIMER LOGIC
   ============================================================ */

function wireTimer() {
  const prep = document.getElementById('prepBtn');
  const speak = document.getElementById('speakBtn');
  const reset = document.getElementById('resetTimer');
  if (!prep) return;

  prep.addEventListener('click', () => startTimer(60, 'PREP — Take notes'));
  speak.addEventListener('click', () => startTimer(120, 'SPEAK — On lap'));
  reset.addEventListener('click', () => stopTimer(true));
}

function startTimer(seconds, stageLabel) {
  stopTimer();
  state.timerEnd = Date.now() + seconds * 1000;
  state.timerStage = stageLabel;
  const total = seconds * 1000;

  const tick = () => {
    const remaining = Math.max(0, state.timerEnd - Date.now());
    const sec = Math.ceil(remaining / 1000);
    const mm = String(Math.floor(sec / 60)).padStart(2, '0');
    const ss = String(sec % 60).padStart(2, '0');
    const display = document.getElementById('timerDisplay');
    const bar = document.getElementById('timerBar');
    const stage = document.getElementById('timerStage');
    if (!display) return;
    display.textContent = `${mm}:${ss}`;
    display.classList.toggle('warn', remaining < 30000 && remaining > 10000);
    display.classList.toggle('danger', remaining <= 10000 && remaining > 0);
    if (stage) stage.textContent = stageLabel;
    if (bar) bar.style.width = `${100 - (remaining / total * 100)}%`;
    if (remaining <= 0) {
      stopTimer();
      // Beep / vibrate
      if (navigator.vibrate) navigator.vibrate([180, 80, 180]);
      showToast('Time! ✓');
    }
  };
  tick();
  state.timer = setInterval(tick, 200);
}

function stopTimer(clear = false) {
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  if (clear) {
    const display = document.getElementById('timerDisplay');
    const bar = document.getElementById('timerBar');
    const stage = document.getElementById('timerStage');
    if (display) { display.textContent = '--:--'; display.classList.remove('warn', 'danger'); }
    if (bar) bar.style.width = '0%';
    if (stage) stage.textContent = 'PIT LANE — Tap "Prep" to start';
  }
}

/* ============================================================
   SPEECH RECOGNITION
   ============================================================ */

function wireRecording(ctx) {
  const startBtn = document.getElementById('startRec');
  const stopBtn = document.getElementById('stopRec');
  const editBtn = document.getElementById('editRec');
  const submitBtn = document.getElementById('submitRec');
  const transcript = document.getElementById('transcript');

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById('recStatus').textContent = 'NO MIC SUPPORT';
    startBtn.disabled = true;
    transcript.textContent = "Your browser doesn't support speech recognition. Use Chrome or Edge on phone, or type your answer in the box (tap EDIT) and submit.";
    editBtn.disabled = false;
    editBtn.click();
    return;
  }

  startBtn.addEventListener('click', () => {
    state.recognition = new SR();
    state.recognition.continuous = true;
    state.recognition.interimResults = true;
    state.recognition.lang = 'en-US';

    state.recognition.onresult = (e) => {
      let interim = '';
      let final = state.finalTranscript;
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const txt = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          final += txt + ' ';
        } else {
          interim += txt;
        }
      }
      state.finalTranscript = final;
      state.transcript = (final + interim).trim();
      transcript.textContent = state.transcript;
      transcript.scrollTop = transcript.scrollHeight;
      submitBtn.disabled = state.transcript.length < 10;
    };

    state.recognition.onerror = (e) => {
      console.warn('Speech error:', e.error);
      if (e.error === 'no-speech') return;
      if (e.error === 'not-allowed') {
        showToast('Microphone access denied');
      }
      stopRecording();
    };

    state.recognition.onend = () => {
      // Auto-restart if still recording (continuous on mobile sometimes ends)
      if (state.recording) {
        try { state.recognition.start(); } catch {}
      }
    };

    try {
      state.recognition.start();
      state.recording = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      editBtn.disabled = true;
      const status = document.getElementById('recStatus');
      status.textContent = 'RECORDING';
      status.classList.add('live');
    } catch (err) {
      showToast('Cannot start microphone');
    }
  });

  stopBtn.addEventListener('click', () => {
    stopRecording();
    editBtn.disabled = false;
  });

  editBtn.addEventListener('click', () => {
    transcript.contentEditable = 'true';
    transcript.classList.add('editing');
    transcript.focus();
    editBtn.disabled = true;
  });

  transcript.addEventListener('input', () => {
    state.transcript = transcript.textContent.trim();
    state.finalTranscript = state.transcript;
    submitBtn.disabled = state.transcript.length < 10;
  });

  submitBtn.addEventListener('click', () => {
    if (state.recording) stopRecording();
    transcript.contentEditable = 'false';
    transcript.classList.remove('editing');
    submitToCoach(ctx);
  });
}

function stopRecording() {
  if (state.recognition) {
    state.recording = false;
    try { state.recognition.stop(); } catch {}
    state.recognition = null;
  }
  const status = document.getElementById('recStatus');
  if (status) {
    status.textContent = 'STOPPED';
    status.classList.remove('live');
  }
  const startBtn = document.getElementById('startRec');
  const stopBtn = document.getElementById('stopRec');
  if (startBtn) startBtn.disabled = false;
  if (stopBtn) stopBtn.disabled = true;
}

/* ============================================================
   AI COACH — DEEPSEEK API
   ============================================================ */

async function submitToCoach(ctx) {
  const apiKey = localStorage.getItem(STORAGE_KEYS.apiKey);
  if (!apiKey) {
    showToast('Set your DeepSeek API key in settings first');
    setTimeout(renderSettings, 800);
    return;
  }

  const fbArea = document.getElementById('feedbackArea');
  fbArea.innerHTML = `
    <div class="feedback">
      <div class="loading">
        <div class="lights" id="loadLights">
          ${[0,1,2,3,4].map(i => `<div class="light" data-i="${i}"></div>`).join('')}
        </div>
        <div class="loading-text" id="loadText">PIT WALL ANALYZING...</div>
      </div>
    </div>
  `;
  // Animate F1 start lights
  let lightIdx = 0;
  const lightInterval = setInterval(() => {
    document.querySelectorAll('#loadLights .light').forEach((l, i) => {
      l.classList.toggle('on', i <= lightIdx);
    });
    lightIdx = (lightIdx + 1) % 6;
  }, 350);

  // Build prompt
  const sysPrompt = buildSystemPrompt(ctx);
  const userMsg = buildUserMessage(ctx);

  try {
    const result = await callDeepSeek(apiKey, sysPrompt, userMsg);
    clearInterval(lightInterval);
    markAttempt(ctx.qKey);
    if (result.overall_band >= 6) markMastered(ctx.qKey, result.overall_band);
    renderFeedback(result, ctx);
  } catch (err) {
    clearInterval(lightInterval);
    fbArea.innerHTML = `
      <div class="feedback">
        <div class="fb-section">
          <div class="fb-label">⚠ ANALYSIS FAILED</div>
          <div class="fb-content">${err.message || 'Could not connect to DeepSeek. Check your API key in settings, or try again in a moment.'}</div>
        </div>
        <button class="btn btn-block" onclick="document.getElementById('submitRec').click()" style="margin-top:8px">RETRY</button>
      </div>
    `;
  }
}

function buildSystemPrompt(ctx) {
  const partLabel = ctx.partType === 'part1' ? 'IELTS Speaking Part 1 (interview)' :
                    ctx.partType === 'part2' ? 'IELTS Speaking Part 2 (long turn / cue card)' :
                    'IELTS Speaking Part 3 (discussion)';
  const targetBand = '6.0–6.5';

  let strategyGuidance = '';
  if (ctx.partType === 'part1') {
    strategyGuidance = `For Part 1, the answer should be 2–4 natural sentences. Look for natural development: opinion + reason + brief example. Don't expect CRISP here.`;
  } else if (ctx.partType === 'part2') {
    strategyGuidance = `For Part 2 (Long Turn), the student is taught the PPF method: Past, Present, Future. Check whether her answer covers a story (Past), current thoughts (Present), and looking ahead (Future). Also check whether she addressed the cue card bullets. Aim length: ~1.5–2 minutes of speech (~200–300 words).`;
  } else {
    strategyGuidance = `For Part 3, the student is taught the CRISP framework:
  C - Comparison (contrast time periods, groups, ideas)
  R - Reason (explain WHY)
  I - Influence (consequences, impact)
  S - Supporting Example (real-world example)
  P - Personal Example (own experience)
She should aim for 5+ sentences and use 2–3 CRISP elements.`;
  }

  return `You are an experienced IELTS Speaking examiner and coach giving feedback to Tracy, a Chinese student preparing for IELTS in 2 weeks. Her current level is around Band 5.0–5.5 and her target is ${targetBand}.

You are evaluating a ${partLabel} response.

${strategyGuidance}

Your feedback must be:
1. Specific to HER actual words — quote her phrases.
2. Encouraging but honest — her real level matters more than being kind.
3. Focused on ONE specific actionable improvement (not five).
4. For Part 3: explicitly tag which CRISP elements she used and which she missed, and SHOW HER how to add a missing element with a concrete sample sentence using HER topic.

Output ONLY a single JSON object (no markdown, no code fences) with this exact structure:
{
  "overall_band": 6.0,
  "scores": {
    "fluency": 6,
    "lexical": 6,
    "grammar": 5,
    "pronunciation": null
  },
  "strengths": "What she did well — quote her exact phrases. 1–2 sentences.",
  "main_issue": "The ONE most impactful thing to fix. Be specific.",
  "fix_demo": "A concrete sample sentence she could have said, using HER topic. Show her HOW.",
  "crisp_used": ["R", "S"],
  "crisp_missing": ["C", "I", "P"],
  "crisp_demo": "If Part 3: pick ONE missing CRISP element and write a sample sentence using HER topic. If not Part 3, set to null.",
  "vocab_upgrade": "A specific word/phrase she used + a Band 6.5+ alternative. Format: 'You said X — try Y'.",
  "encouragement": "One genuine, specific motivational sentence."
}

Use band scores as integers or .5 increments. Pronunciation is null since you can't hear her — only score what's evident from text. Keep all fields concise — this displays on a phone.`;
}

function buildUserMessage(ctx) {
  let prompt = `Question: ${ctx.question}\n\n`;
  if (ctx.partType === 'part2') {
    prompt += `Cue card bullets:\n${ctx.topic.bullets.map(b => '- ' + b).join('\n')}\n\n`;
  }
  prompt += `Tracy's answer:\n"${state.transcript}"\n\nGive feedback as JSON.`;
  return prompt;
}

async function callDeepSeek(apiKey, systemPrompt, userMessage) {
  const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${apiKey}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      model: 'deepseek-chat',
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userMessage },
      ],
      temperature: 0.4,
      response_format: { type: 'json_object' },
    }),
  });

  if (!resp.ok) {
    let errMsg = `API error ${resp.status}`;
    try {
      const j = await resp.json();
      errMsg = j.error?.message || errMsg;
    } catch {}
    throw new Error(errMsg);
  }

  const data = await resp.json();
  const content = data.choices?.[0]?.message?.content;
  if (!content) throw new Error('Empty response from DeepSeek');

  // Strip code fences if present
  const cleaned = content.replace(/```json|```/g, '').trim();
  try {
    return JSON.parse(cleaned);
  } catch (e) {
    throw new Error('Could not parse coach response. Try again.');
  }
}

async function getModelAnswer(apiKey, ctx) {
  const partLabel = ctx.partType === 'part1' ? 'Part 1' : ctx.partType === 'part2' ? 'Part 2 (cue card)' : 'Part 3';
  const guidance = ctx.partType === 'part1' ? 'Write 2–4 sentences. Natural and direct. No filler.'
    : ctx.partType === 'part2' ? 'Write a 200–250 word answer using the PPF method (clear past story, present thoughts, brief future). Natural rhythm, not formulaic. Use the cue card bullets.'
    : 'Write a 5–6 sentence answer for Tracy at Band 6.5 level. Use 3 CRISP elements. Tag them inline like (C), (R), (I), (S), (P) at the end of each sentence that uses one.';

  const sys = `You are writing a sample IELTS Speaking ${partLabel} answer for a Chinese student aiming for Band 6.5. ${guidance} Use natural conversational English — not academic. Write only the answer text, no preamble. Wrap CRISP tags in [brackets] for Part 3. Keep paragraph form (no bullet points).`;
  const usr = `Question: ${ctx.question}\n${ctx.partType === 'part2' ? 'Cue card bullets:\n' + ctx.topic.bullets.map(b => '- ' + b).join('\n') : ''}\n\nWrite the model answer.`;

  const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'deepseek-chat',
      messages: [{ role: 'system', content: sys }, { role: 'user', content: usr }],
      temperature: 0.6,
    }),
  });
  if (!resp.ok) throw new Error('API error');
  const data = await resp.json();
  let text = data.choices?.[0]?.message?.content || '';
  // Bold CRISP tags
  text = escapeHtml(text).replace(/\[([CRISP])\]/g, '<strong style="color:var(--amber);font-family:var(--mono);font-size:12px">[$1]</strong>');
  return text.replace(/\n/g, '<br>');
}

function scoreItem(name, val) {
  if (val === null || val === undefined) {
    return `<div class="score-item"><div class="score-name">${name}</div><div class="score-val" style="color:var(--txt-mute)">—</div></div>`;
  }
  const cls = val >= 7 ? 's7' : val >= 6 ? 's6' : 's5';
  return `<div class="score-item"><div class="score-name">${name}</div><div class="score-val ${cls}">${val}</div></div>`;
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/* ============================================================
   SETTINGS MODAL
   ============================================================ */

function renderSettings() {
  const existing = localStorage.getItem(STORAGE_KEYS.apiKey) || '';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-title">SETTINGS</div>
      <div class="modal-sub">Configure your AI coach</div>

      <div class="modal-row">
        <label class="field-label">DEEPSEEK API KEY</label>
        <input type="password" id="apiKeyInput" class="field-input" value="${existing}" placeholder="sk-...">
        <div class="modal-help">
          Get a key from <a href="https://platform.deepseek.com/api_keys" target="_blank">platform.deepseek.com</a>. Stored only on this device. Never shared.
        </div>
      </div>

      <div class="modal-row">
        <label class="field-label">PROGRESS</label>
        <div style="font-size:13px;color:var(--txt-dim);margin-bottom:8px">
          ${overallStats().attempted} questions attempted · ${overallStats().mastered} at Band 6+
        </div>
        <button class="btn btn-ghost btn-icon" id="resetProgress">RESET PROGRESS</button>
      </div>

      <div class="modal-row">
        <label class="field-label">SESSION</label>
        <button class="btn btn-ghost btn-icon" id="logoutBtn">LOG OUT</button>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelSettings">CANCEL</button>
        <button class="btn" id="saveSettings">SAVE</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  const close = () => modal.remove();
  modal.addEventListener('click', close);

  document.getElementById('cancelSettings').addEventListener('click', close);

  document.getElementById('saveSettings').addEventListener('click', () => {
    const k = document.getElementById('apiKeyInput').value.trim();
    if (k) localStorage.setItem(STORAGE_KEYS.apiKey, k);
    close();
    showToast('Settings saved');
  });

  document.getElementById('resetProgress').addEventListener('click', () => {
    if (confirm('Reset all progress? This cannot be undone.')) {
      progress.attempts = {};
      progress.mastered = {};
      saveProgress();
      close();
      renderHome();
      showToast('Progress reset');
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEYS.auth);
    state.authed = false;
    close();
    renderGate();
  });
}

/* ============================================================
   TOAST
   ============================================================ */

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    setTimeout(() => t.remove(), 300);
  }, 2200);
}

/* ============================================================
   BOOT
   ============================================================ */

if (isAuthValid()) {
  state.authed = true;
  renderHome();
} else {
  renderGate();
}

// Prevent accidental zoom on iOS
document.addEventListener('gesturestart', e => e.preventDefault());
</script>

</body>
</html>
